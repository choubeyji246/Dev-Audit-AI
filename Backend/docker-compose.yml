version: '3.8'

services:
  # Local message broker for background repository scanning tasks
  redis:
    image: redis:7.0-alpine
    container_name: devaudit-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  redis-data: