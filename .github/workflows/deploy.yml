name: DevAudit AI Cloud Deployment Engine

on:
  push:
    branches:
      - main # 🚀 Triggers automatically whenever you push code modifications to the main branch

jobs:
  deploy:
    name: Execute Remote Handshake and Code Sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository Frames
        uses: actions/checkout@v4

      - name: Deploy Full Stack Cluster to AWS EC2 via Secure SSH Shell
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "🚀 Initializing Remote Server Deployment Framework..."
            
            # 1. Update package manager indexes if baseline engines are missing
            sudo apt-get update -y
            if ! type node > /dev/null 2>&1; then
              echo "📦 Provisioning missing Node.js runtime layers..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            if ! type pm2 > /dev/null 2>&1; then
              sudo npm install -g pm2
            fi

            # 2. Synchronize source asset directory modifications
            if [ ! -d "Dev-Audit-AI" ]; then
              echo "📂 Creating clean target directory deployment tracks..."
              git clone https://github.com/choubeyji246/Dev-Audit-AI.git
              cd Dev-Audit-AI
            else
              cd Dev-Audit-AI
              echo "🔄 Merging fresh code segments directly from GitHub origin main..."
              git reset --hard HEAD
              git pull origin main
            fi

            # 3. Compile Core Node.js / TypeScript API Gateway Stack
            echo "⚡ Compiling TypeScript build files..."
            cd ~/Dev-Audit-AI/Backend # Navigates directly to your core node project directory
            npm install
            npm run build # Generates your required dist/ folder compilation maps

            # 4. Stabilize Python Microservice Dependencies
            echo "🐍 Syncing Python AI worker libraries..."
            cd ~/Dev-Audit-AI/Backend/devaudit-ai-service # Matches your real repository directory pattern
            if [ -d "venv" ]; then
              source venv/bin/activate
              pip install -r requirements.txt
              deactivate
            else
              python3 -m venv venv
              source venv/bin/activate
              pip install -r requirements.txt
              deactivate
            fi

            # 5. Build Vite React Static Frontend Interface Assets
            echo "💻 Refreshing Client Application Bundle Layers..."
            cd ~/Dev-Audit-AI/devaudit-ai-ui
            npm install
            npm run build # Compiles fresh assets inside the tracking dev-audit-ui/dist directory

            # 6. Apply Execution Bit Flags For Nginx Folder Traversal
            chmod +x /home/ubuntu
            chmod -R 755 ~/Dev-Audit-AI/devaudit-ai-ui/dist

            # 7. Safe Balancing Matrix Re-cycles Inside PM2 Background Engines
            echo "🔄 Synchronizing live process states inside process control managers..."
            
            # --- TIER 1: NODE BACKEND GATEWAY RESTART PROTOCOL ---
            pm2 describe devaudit-api > /dev/null 2>&1
            if [ $? -eq 0 ]; then
              echo "🔁 Hot-reloading active Node execution workers..."
              pm2 reload devaudit-api --update-env
            else
              echo "🚀 Instantiating fresh Node lifecycle runtime engine..."
              pm2 start dist/index.js --name "devaudit-api" # Points directly to your compiled script
            fi

            # --- TIER 2: PYTHON AI CORE ENGINE RESTART PROTOCOL ---
            pm2 describe devaudit-ai > /dev/null 2>&1
            if [ $? -eq 0 ]; then
              echo "🔁 Hot-reloading active Python vector pipelines..."
              pm2 reload devaudit-ai --update-env
            else
              echo "🚀 Instantiating fresh Uvicorn lifecycle workers..."
              pm2 start "Backend/devaudit-ai-service/venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000" --name "devaudit-ai" # Targets app/main.py configuration
            fi

            pm2 save
            echo "🏁 Continuous Deployment integration completed successfully!"